    };

    // ---------- CALENDARIO ----------
    const WEEKDAYS = ['lun', 'mar', 'mer', 'gio', 'ven', 'sab', 'dom'];
    let calView = (() => { let d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();
    let calSelected = isoDay(new Date());

    function todoGroup(t) {
        return t.done ? 'done' : dateInfo(t).group;
    }

    function todosOn(iso) {
        let k = t => t.time || '99:99';
        return todos.filter(t => t.date === iso)
            .sort((a, b) => (a.done - b.done) || k(a).localeCompare(k(b)) || byText(a.text, b.text));
    }

    function showMonthOf(iso) {
        let d = parseDay(iso);
        calView = { y: d.getFullYear(), m: d.getMonth() };
    }

    function calRow(t, withDate) {
        let when = t.time ? esc(t.time) : '—';
        if (withDate) when = t.date ? esc(parseDay(t.date).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' })) : '—';
        return `<div class="cal-item ${todoGroup(t)}">
                    <button class="todo-check" type="button" data-cal-check="${t.id}" aria-label="${t.done ? 'Segna come da fare' : 'Segna come fatta'}">${t.done ? '✓' : ''}</button>
                    <button type="button" class="cal-item-main" data-cal-edit="${t.id}" aria-label="Modifica">
                        <span class="cal-item-time">${when}</span>
                        <span class="cal-item-text">${esc(t.text)}${(t.gcal || t.gEventId) ? ' <span class="cal-sent" title="Su Google Calendar">📆</span>' : ''}</span>
                        <span class="cal-item-edit">✏️</span>
                    </button>
                </div>`;
    }

    function renderCalendar() {
        let box = document.getElementById('calBox');
        if (!box) return;
        let { y, m } = calView;
        let first = new Date(y, m, 1);
        let offset = (first.getDay() + 6) % 7;   // settimana da lunedì
        let days = new Date(y, m + 1, 0).getDate();
        let weeks = Math.ceil((offset + days) / 7);
        let today = isoDay(new Date());
        let prefix = `${y}-${pad2(m + 1)}-`;
        let monthCount = todos.filter(t => t.date && t.date.startsWith(prefix)).length;
        let title = first.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });

        let html = `<div class="cal-head">
                <button type="button" class="cal-nav" data-cal-nav="-1" aria-label="Mese precedente">‹</button>
                <div class="cal-title">${esc(title)}</div>
                <button type="button" class="cal-nav" data-cal-nav="1" aria-label="Mese successivo">›</button>
            </div>
            <div class="cal-tools">
                <button type="button" data-cal-today="1">Oggi</button>
                <span class="cal-count">${monthCount === 1 ? '1 attività' : monthCount + ' attività'} in questo mese</span>
            </div>
            <div class="cal-grid">${WEEKDAYS.map(w => `<div class="cal-wd">${w}</div>`).join('')}`;

        for (let i = 0; i < weeks * 7; i++) {
            let d = new Date(y, m, 1 - offset + i);
            let iso = isoDay(d);
            let list = todosOn(iso);
            let cls = ['cal-cell'];
            if (d.getMonth() !== m) cls.push('other');
            if (iso === today) cls.push('today');
            if (iso === calSelected) cls.push('selected');
            let chips = list.slice(0, 3).map(t =>
                `<button type="button" class="cal-ev ${todoGroup(t)}" data-cal-edit="${t.id}" title="${esc((t.time ? t.time + ' ' : '') + t.text)}">${t.time ? `<span class="cal-ev-time">${esc(t.time)} </span>` : ''}${esc(t.text)}</button>`
            ).join('');
            if (list.length > 3) chips += `<span class="cal-more">+${list.length - 3}</span>`;
            html += `<div class="${cls.join(' ')}" data-cal-day="${iso}" role="button" aria-label="${esc(d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' }))}"><span class="cal-num">${d.getDate()}</span>${chips}</div>`;
        }
        html += `</div>`;

        // Elenco del giorno selezionato
        let sel = parseDay(calSelected);
        let selList = todosOn(calSelected);
        html += `<div class="cal-day">
                <div class="cal-day-title">${esc(sel.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }))}</div>`;
        if (!selList.length) html += `<div class="cal-empty">Nessuna attività in questo giorno</div>`;
        for (let t of selList) html += calRow(t, false);
        html += `<div class="cal-add">
                    <input type="text" id="calNewText" placeholder="Nuova attività in questo giorno..." enterkeyhint="done" aria-label="Nuova attività">
                    <input type="time" id="calNewTime" aria-label="Ora (facoltativa)">
                    ${gLinked() ? `<button type="button" id="calRemBtn" class="${calNewRem !== null ? 'on' : ''}" aria-label="Notifiche su Google Calendar">🔔</button>` : ''}
                    <button type="button" id="calAddBtn" aria-label="Aggiungi">➕</button>
                </div>
                ${gLinked() ? `<div class="rem-box" id="calRemBox" style="${calRemOpen ? '' : 'display:none;'}"></div>` : ''}
            </div>`;

        // Attività rimaste indietro e attività senza data
        let k = t => (t.date || '') + (t.time || '99:99');
        let late = todos.filter(t => !t.done && t.date && dateInfo(t).group === 'late').sort((a, b) => k(a).localeCompare(k(b)));
        let undated = todos.filter(t => !t.done && !t.date).sort((a, b) => byText(a.text, b.text));
        if (late.length) html += `<div class="cal-day"><div class="cal-section late">⚠️ In ritardo (${late.length})</div>${late.map(t => calRow(t, true)).join('')}</div>`;
        if (undated.length) html += `<div class="cal-day"><div class="cal-section">📝 Senza data (${undated.length})</div>${undated.map(t => calRow(t, true)).join('')}<div class="cal-empty">Tocca un'attività per darle una data.</div></div>`;
        box.innerHTML = html;
        let remBox = document.getElementById('calRemBox');
        calRemCtl = remBox ? bindRemEditor(remBox, () => !!(document.getElementById('calNewTime') || {}).value, calNewRem, (st) => {
            calNewRem = st;
            let b = document.getElementById('calRemBtn');
            if (b) b.classList.toggle('on', st !== null);
        }) : null;
    }

    // ---------- NOTIFICHE DI GOOGLE CALENDAR ----------
    const REM_UNITS = [['minuti', 1], ['ore', 60], ['giorni', 1440], ['settimane', 10080]];

    function remRowTimed(m, i) {
        let f = 1;
        for (let [, size] of REM_UNITS) if (m >= size && m % size === 0) f = size;
        return `<div class="rem-row">
                <input type="number" class="rem-n" min="0" max="${40320 / f}" value="${m / f}" inputmode="numeric" aria-label="Quanto prima">
                <select class="rem-u" aria-label="Unità">${REM_UNITS.map(([u, size]) => `<option value="${size}" ${size === f ? 'selected' : ''}>${u}</option>`).join('')}</select>
                <span>prima</span>
                <button type="button" class="rem-del" data-rem-del="${i}" aria-label="Togli notifica">✖</button>
            </div>`;
    }

    // Attività senza orario: l'evento inizia a mezzanotte, quindi "N giorni prima alle HH:MM"
    function remRowAllDay(m, i) {
        let days = Math.ceil(m / 1440);
        let mins = days * 1440 - m;
        return `<div class="rem-row">
                <input type="number" class="rem-d" min="0" max="28" value="${days}" inputmode="numeric" aria-label="Giorni prima">
                <span>giorni prima alle</span>
                <input type="time" class="rem-t" value="${pad2(Math.floor(mins / 60))}:${pad2(mins % 60)}" aria-label="Ora">
                <button type="button" class="rem-del" data-rem-del="${i}" aria-label="Togli notifica">✖</button>
            </div>`;
    }

    function remEditorHtml(rem, timed) {
        let mode = rem === null ? 'default' : (rem.length ? 'custom' : 'none');
        let html = `<div class="rem-title">🔔 Notifiche su Google Calendar</div>
            <select class="rem-mode" aria-label="Tipo di notifiche">
                <option value="default" ${mode === 'default' ? 'selected' : ''}>Quelle predefinite di Google</option>
                <option value="custom" ${mode === 'custom' ? 'selected' : ''}>Scelgo io</option>
                <option value="none" ${mode === 'none' ? 'selected' : ''}>Nessuna notifica</option>
            </select>`;
        if (mode === 'custom') {
            html += rem.map((m, i) => timed ? remRowTimed(m, i) : remRowAllDay(m, i)).join('');
            if (rem.length < 5) html += `<button type="button" class="rem-add" data-rem-add="1">+ Aggiungi notifica</button>`;
            if (!timed) html += `<div class="rem-hint">Senza orario l'evento dura tutto il giorno: le notifiche possono arrivare al più tardi a mezzanotte del giorno stesso (0 giorni prima alle 00:00).</div>`;
        }
        return html;
    }

    // Legge le righe nell'ordine in cui sono mostrate
    function readRemRows(box, timed) {
        return [...box.querySelectorAll('.rem-row')].map(row => {
            if (timed) {
                let n = parseFloat(row.querySelector('.rem-n').value);
                let f = Number(row.querySelector('.rem-u').value) || 1;
                return isNaN(n) ? null : Math.round(n * f);
            }
            let d = parseInt(row.querySelector('.rem-d').value);
            let [h, mi] = (row.querySelector('.rem-t').value || '09:00').split(':').map(Number);
            if (isNaN(d)) return null;
            return Math.max(0, d * 1440 - (h * 60 + mi));
        }).filter(n => n !== null);
    }

    function bindRemEditor(box, isTimed, initial, onChange) {
        let state = normRem(initial);
        let read = () => {
            let modeEl = box.querySelector('.rem-mode');
            let mode = modeEl ? modeEl.value : 'default';
            if (mode === 'default') return null;
            if (mode === 'none') return [];
            return normRem(readRemRows(box, isTimed()));
        };
        let draw = () => { box.innerHTML = remEditorHtml(state, isTimed()); };
        let update = (s) => { state = normRem(s); if (onChange) onChange(state); };
        box.onchange = (e) => {
            if (e.target.classList.contains('rem-mode')) {
                let mode = e.target.value;
                update(mode === 'default' ? null : mode === 'none' ? [] : (state && state.length ? state : [isTimed() ? 30 : 900]));
                draw();
            } else {
                update(read());
            }
        };
        box.onclick = (e) => {
            let add = e.target.closest('[data-rem-add]');
            let del = e.target.closest('[data-rem-del]');
            if (!add && !del) return;
            let rows = readRemRows(box, isTimed());
            if (add) {
                let options = isTimed() ? [10, 30, 60, 120, 1440, 2880, 10080] : [900, 2340, 3780, 9540];
                // la nuova notifica va in fondo: un anticipo più lungo di quelli già scelti
                let longest = rows.length ? Math.max(...rows) : -1;
                rows.push(options.find(o => o > longest) || options.find(o => !rows.includes(o)) || 0);
            } else {
                rows.splice(Number(del.dataset.remDel), 1);
            }
            update(rows);
            draw();
        };
        draw();
        return { get: () => read(), redraw: () => { state = read(); draw(); } };
    }

    let calNewRem = null, calRemOpen = false, calRemCtl = null;

    function addFromCalendar() {
        let text = document.getElementById('calNewText');
        let time = document.getElementById('calNewTime');
        if (!text.value.trim()) { text.focus(); return; }
        let rem = gLinked() ? calNewRem : null;
        calNewRem = null;
        calRemOpen = false;
        addTodo(text.value, calSelected, time.value || '', rem);
        let again = document.getElementById('calNewText');
        if (again) again.focus();   // per inserirne più di fila
    }

    // Finestra di modifica di un'attività (dal calendario)
    function showTodoModal(id) {
        let t = todos.find(t => t.id === id);
        if (!t) return;
        let googleDay = t.date ? `https://calendar.google.com/calendar/r/day/${t.date.replace(/-0?/g, '/')}` : 'https://calendar.google.com/';
        let overlay = openModal(`
            <h3>✏️ Modifica attività</h3>
            <label class="modal-field">Testo
                <input type="text" class="m-text" value="${esc(t.text)}">
            </label>
            <div class="modal-row">
                <label class="modal-field">Data
                    <input type="date" class="m-date" value="${esc(t.date)}">
                </label>

                    <input type="time" class="m-time" value="${esc(t.time)}">
                </label>

            <label class="modal-check"><input type="checkbox" class="m-done" ${t.done ? 'checked' : ''}> Fatta</label>
            ${gLinked() ? '<div class="rem-box m-rem"></div>' : ''}
            ${gcalModalHtml(t, googleDay)}
            <div class="sync-error" role="alert"></div>
            <div class="modal-actions">
                <button class="btn-delete m-del" type="button">🗑️ Elimina</button>
                <button class="btn-cancel m-cancel" type="button">Annulla</button>

        q('.m-del').onclick = () => {

            let wasSent = t.gcal;
            overlay.remove();

        };
        q('.m-save').onclick = () => {
            let text = q('.m-text').value.trim();
            if (!text) { q('.sync-error').textContent = 'Il testo non può essere vuoto'; return; }
            let date = q('.m-date').value || '';
            let time = q('.m-time').value || '';
            if (time && !date) date = isoDay(new Date());   // solo l'ora: si intende oggi
            if (!date) time = '';
            let changed = text !== t.text || date !== t.date || time !== t.time;
            let wasSent = t.gcal;
            overlay.remove();
            if (date) { calSelected = date; showMonthOf(date); }
            updateTodo(t.id, { text, date, time, done: q('.m-done').checked, gcal: (changed && !gLinked()) ? false : t.gcal, rem: remCtl ? remCtl.get() : t.rem });
            if (changed && wasSent) showToast('📆 Ricorda di aggiornare l\'evento anche su Google Calendar');
        };
        // Invio a Google Calendar: salva anche le modifiche fatte nella finestra
        let gl = q('.m-gcal');
        if (gl) gl.onclick = (e) => {
            let text = q('.m-text').value.trim();
            let date = q('.m-date').value || '';
            let time = date ? (q('.m-time').value || '') : '';
            if (!text || !date) {
                e.preventDefault();
                q('.sync-error').textContent = !text ? 'Il testo non può essere vuoto' : 'Scegli prima una data';
                return;
            }
            gl.href = gcalUrl({ text, date, time });
            setTimeout(() => {
                overlay.remove();
                calSelected = date;
                showMonthOf(date);
                updateTodo(t.id, { text, date, time, done: q('.m-done').checked, gcal: true });
            }, 0);
        };
        let remCtl = q('.m-rem') ? bindRemEditor(q('.m-rem'), () => !!q('.m-time').value, t.rem) : null;
        if (remCtl) q('.m-time').onchange = () => remCtl.redraw();
        let link = q('.m-link');
        if (link) link.onclick = (e) => {
            e.preventDefault();
            overlay.remove();

            showToast('🔗 Verrà collegata a Google Calendar', 'success');
        };
        let ti = q('.m-text');
        ti.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); q('.m-save').click(); } };
    }

    document.getElementById('calBox').onclick = (e) => {

    // ---------- AVVISI ALLA SCADENZA (solo mentre l'app è aperta) ----------
    let lastDayChecked = isoDay(new Date());

    function canNotify() {
        return typeof Notification !== 'undefined';
    }

    function renderNotifyBtn() {
        document.getElementById('notifyBtn').style.display = (canNotify() && Notification.permission === 'default') ? '' : 'none';
    }

    document.getElementById('notifyBtn').onclick = () => {
        let done = () => {
            renderNotifyBtn();
            if (Notification.permission === 'granted') showToast('🔔 Avvisi attivi: arrivano solo mentre l\'app è aperta', 'success');
            else if (Notification.permission === 'denied') showToast('Avvisi bloccati dal browser: vedrai solo quelli dentro l\'app');
        };
        try {
            let r = Notification.requestPermission(done);
            if (r && r.then) r.then(done, done);
        } catch (e) {
            document.getElementById('notifyBtn').style.display = 'none';
        }
    };

    function checkDue() {
        let now = new Date();
        let due = [];
        // gli avvisi già mostrati si ricordano solo su questo dispositivo
        let seen = {};
        try { seen = JSON.parse(lsGet('spesaflow_notified') || '{}') || {}; } catch (e) { seen = {}; }
        todos.forEach(t => {
            if (t.done || !t.date || !t.time) return;
            let key = t.date + 'T' + t.time;
            if (seen[t.id] === key || dueMoment(t) > now) return;
            seen[t.id] = key;
            due.push(t);
        });
        let today = isoDay(now);
        let dayChanged = today !== lastDayChecked;
        lastDayChecked = today;
        if (due.length) {
            Object.keys(seen).forEach(id => { if (!todos.some(t => String(t.id) === id)) delete seen[id]; });
            lsSet('spesaflow_notified', JSON.stringify(seen));
            let msg = due.length === 1 ? `${due[0].text} (${due[0].time})` : `${due.length} cose da fare in scadenza`;
            showToast('⏰ ' + msg);
            if (canNotify() && Notification.permission === 'granted') {
                try { new Notification('⏰ Cose da fare', { body: msg }); } catch (e) { /* su alcuni telefoni non è permesso: resta l'avviso nell'app */ }
            }
        }
        if (due.length || dayChanged) renderTodos();
    }

    // ---------- SINCRONIZZAZIONE TRA DISPOSITIVI (archivio privato "Gist" su GitHub) ----------
    function syncOn() {
        return !!(sync.token && sync.gistId);
    }

    function loadSync() {
        try {
            let s = JSON.parse(lsGet('spesaflow_sync') || '{}') || {};
            sync = { token: s.token || '', gistId: s.gistId || '', base: Number(s.base) || 0, dirty: !!s.dirty, lastOk: Number(s.lastOk) || 0 };
        } catch (e) { /* resta scollegata */ }
    }

    function saveSync() {
        lsSet('spesaflow_sync', JSON.stringify(sync));
    }

    function fmtMoment(ts) {
        return new Date(ts).toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function syncStatusText() {
        if (syncState === 'busy') return '⏳ Sincronizzazione in corso…';
        if (syncState === 'error') return '⚠️ ' + syncError;
        if (syncState === 'ok') return '✅ Sincronizzata' + (sync.lastOk ? ` (ultimo controllo: ${fmtMoment(sync.lastOk)})` : '');
        return 'Non attiva';
    }

    function setSyncState(state, msg) {
        syncState = state;
        syncError = msg || '';
        let btn = document.getElementById('syncBtn');
        btn.textContent = ({ off: '☁️', busy: '⏳', ok: '✅', error: '⚠️' }[state] || '☁️') + ' Sync';
        let line = document.getElementById('syncStatusLine');
        if (line) line.textContent = syncStatusText();
    }

    function syncErrorText(e) {
        if (e && (e.status === 401 || e.status === 403)) return 'La chiave non è valida o è scaduta';
        if (e && e.status === 404) return 'Archivio online non trovato';
        return 'Nessuna connessione: riprovo appena possibile';
    }

    async function gh(path, opts) {
        opts = opts || {};
        let headers = { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + sync.token };
        if (opts.body) headers['Content-Type'] = 'application/json';
        let r = await fetch('https://api.github.com' + path, { method: opts.method || 'GET', body: opts.body, headers, cache: 'no-store' });
        if (!r.ok) { let e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
        return r.json();
    }

    async function readRemote() {
        let g = await gh('/gists/' + sync.gistId);
        let f = g.files && g.files[SYNC_FILE];
        if (!f) return null;
        let text = f.content;
        if (f.truncated && f.raw_url) text = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
        try {
            let d = JSON.parse(text);
            return (d && Array.isArray(d.categories) && Array.isArray(d.notes)) ? d : null;
        } catch (e) { return null; }
    }

    async function pushRemote() {
        let at = dataUpdatedAt;
        await gh('/gists/' + sync.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [SYNC_FILE]: { content: payload() } } }) });
        sync.base = at;
        sync.dirty = dataUpdatedAt !== at;   // modifiche fatte durante l'invio: partono al prossimo giro
    }

    // Sostituisce i dati di questo dispositivo con quelli online
    function applyRemote(r) {
        categories = r.categories;
        notes = r.notes;
        cart = r.cart;
        todos = r.todos;
        if (Array.isArray(r.gDeletes)) gDeletes = r.gDeletes;
        normalizeData();
        dataUpdatedAt = Number(r.updatedAt) || Date.now();
        sync.base = dataUpdatedAt;
        sync.dirty = false;
        writeLocal();
        loadUiState();
        render();
        renderTodos();
        gcalSoon();   // porta su Google le modifiche arrivate dagli altri dispositivi
    }

    // Regola: se entrambe le parti sono cambiate, vince la modifica più recente
    async function syncNow() {
        if (!syncOn()) return;
        if (syncing) { syncAgain = true; return; }
        syncing = true;
        clearTimeout(pushTimer);
        setSyncState('busy');
        try {
            let r = await readRemote();
            if (!r) await pushRemote();
            else if (sync.dirty) {
                if ((Number(r.updatedAt) || 0) > dataUpdatedAt) applyRemote(r);
                else await pushRemote();
            }
            else if ((Number(r.updatedAt) || 0) !== sync.base) applyRemote(r);
            sync.lastOk = Date.now();
            saveSync();
            setSyncState('ok');
        } catch (e) {
            setSyncState('error', syncErrorText(e));
        }
        syncing = false;
        if (syncAgain || sync.dirty) { syncAgain = false; clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 1500); }
    }

    function disconnectSync() {
        clearTimeout(pushTimer);
        sync = { token: '', gistId: '', base: 0, dirty: false, lastOk: 0 };
        saveSync();
        setSyncState('off');
    }

    // Primo collegamento: cerca l'archivio esistente, altrimenti lo crea con i dati di questo dispositivo
    async function connectSync(token) {
        sync = { token, gistId: '', base: 0, dirty: false, lastOk: 0 };
        let list = await gh('/gists?per_page=100');
        let found = Array.isArray(list) ? list.find(g => g.files && g.files[SYNC_FILE]) : null;
        if (found) {
            sync.gistId = found.id;
            let r = await readRemote();
            if (r) return r;   // esistono già dati online: decide l'utente quali tenere
            if (!dataUpdatedAt) dataUpdatedAt = Date.now();
            await pushRemote();
        } else {
            if (!dataUpdatedAt) dataUpdatedAt = Date.now();
            let g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'SpesaFlow - dati sincronizzati', public: false, files: { [SYNC_FILE]: { content: payload() } } }) });
            sync.gistId = g.id;
            sync.base = dataUpdatedAt;
        }
        writeLocal();
        sync.lastOk = Date.now();
        saveSync();
        setSyncState('ok');
        return null;
    }

    function showSyncChoice(remote) {
        let overlay = openModal(`
            <h3>☁️ Dati già presenti online</h3>
            <div class="sync-text">Nel tuo account ci sono già dati di SpesaFlow${remote.updatedAt ? ` (ultima modifica: ${esc(fmtMoment(remote.updatedAt))})` : ''}. Quali vuoi tenere?</div>
            <div class="modal-actions"><button class="btn-confirm c-remote" type="button">⬇️ Usa i dati online</button></div>
            <div class="sync-text">I dati di questo dispositivo vengono sostituiti.</div>
            <div class="modal-actions"><button class="btn-delete c-local" type="button">⬆️ Usa i dati di questo dispositivo</button></div>
            <div class="sync-text">I dati online (e degli altri dispositivi) vengono sostituiti.</div>

    // ---------- GOOGLE CALENDAR (collegamento diretto) ----------
    // Ogni attività con data diventa un evento del calendario principale. Le modifiche passano
    // nei due sensi; se la stessa attività è cambiata da entrambe le parti, vince la modifica più recente.
    const GOOGLE_CLIENT_ID = '742653328373-c3ejaihbn3rja3k069mifj0e0u7unj72.apps.googleusercontent.com';
    const GOOGLE_ORIGIN = 'https://lucioros.github.io';
    const GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
    const GCAL_API = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
    const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Rome'; } catch (e) { return 'Europe/Rome'; } })();
    let gTokenClient = null, gBusy = false, gAgain = false, gError = '', gTimer = null;
    let gCalTz = '';   // fuso orario impostato in Google Calendar

    function gLinked() { return lsGet('spesaflow_glinked') === '1'; }
    function gOriginOk() { return location.origin === GOOGLE_ORIGIN; }
    function gToken() {
        try {
            let t = JSON.parse(lsGet('spesaflow_gtoken') || 'null');
            return (t && t.exp > Date.now()) ? t.token : '';
        } catch (e) { return ''; }
    }
    function gClearToken() { lsSet('spesaflow_gtoken', ''); }

    function gcalSoon() {
        if (!gLinked() || !gToken()) { renderGcalBtn(); return; }
        clearTimeout(gTimer);
        gTimer = setTimeout(gcalReconcile, 1500);
    }

    async function gapi(url, opts) {
        opts = opts || {};
        let headers = { 'Authorization': 'Bearer ' + gToken() };
        if (opts.body) headers['Content-Type'] = 'application/json';
        let r = await fetch(url, { method: opts.method || 'GET', headers, body: opts.body, cache: 'no-store' });
        if (r.status === 401) gClearToken();
        if (!r.ok) { let e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
        return (r.status === 204) ? null : r.json();
    }

    function localStamp(d) {
        return `${isoDay(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`;
    }

    function eventBody(t) {
        let b = {
            summary: (t.done ? '✅ ' : '') + t.text,
            description: 'Attività di SpesaFlow',
            status: 'confirmed',
            extendedProperties: { private: { spesaflowApp: '1', spesaflowId: String(t.id) } },
            reminders: t.rem === null || t.rem === undefined
                ? { useDefault: true }
                : { useDefault: false, overrides: t.rem.map(m => ({ method: 'popup', minutes: m })) }
        };
        if (t.time) {
            let start = dueMoment(t), end = new Date(start.getTime() + 3600000);
            b.start = { dateTime: localStamp(start), timeZone: TZ, date: null };
            b.end = { dateTime: localStamp(end), timeZone: TZ, date: null };
        } else {
            let d = parseDay(t.date);
            b.start = { date: t.date, dateTime: null, timeZone: null };
            b.end = { date: isoDay(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)), dateTime: null, timeZone: null };
        }
        return JSON.stringify(b);
    }

    // Come appare un evento di Google tradotto in attività
    function eventFields(ev) {
        let summary = String(ev.summary || '');
        let done = /^✅/.test(summary);
        let text = summary.replace(/^✅\s*/, '').trim();
        let date = '', time = '';
        if (ev.start && ev.start.dateTime) {
            let d = new Date(ev.start.dateTime);
            date = isoDay(d);
            time = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
        } else if (ev.start && ev.start.date) {
            date = ev.start.date;
        } else return null;
        let rem = (!ev.reminders || ev.reminders.useDefault) ? null
            : normRem((ev.reminders.overrides || []).map(o => o.minutes));
        return { text, date, time, done, rem };
    }

    function differs(t, f) {
        return t.text !== f.text || t.date !== f.date || t.time !== f.time || !!t.done !== f.done ||
            JSON.stringify(normRem(t.rem)) !== JSON.stringify(f.rem);
    }

    async function listLinkedEvents() {
        let items = [], pageToken = '';
        do {
            let q = new URLSearchParams({ privateExtendedProperty: 'spesaflowApp=1', showDeleted: 'true', maxResults: '2500' });
            if (pageToken) q.set('pageToken', pageToken);
            let r = await gapi(GCAL_API + '?' + q.toString());
            if (r && r.timeZone && !pageToken) gCalTz = r.timeZone;
            items.push(...((r && r.items) || []));
            pageToken = (r && r.nextPageToken) || '';
        } while (pageToken);
        return items;
    }

    // Google mostra gli orari nel fuso impostato nel calendario: se è diverso da quello
    // del dispositivo, gli eventi sono all'ora giusta ma appaiono spostati.
    function tzMismatchText() {
        if (!gCalTz || gCalTz === TZ) return '';
        try {
            let sample = new Date();
            sample.setHours(19, 0, 0, 0);
            let here = sample.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
            let there = sample.toLocaleTimeString('it-IT', { timeZone: gCalTz, hour: '2-digit', minute: '2-digit' });
            if (here === there) return '';
            return `Il tuo Google Calendar usa il fuso orario «${gCalTz}», mentre questo dispositivo usa «${TZ}». Per questo su Google gli orari appaiono spostati (le ${here} diventano le ${there}), anche se l'evento è all'ora giusta. Per sistemarlo: in Google Calendar apri Impostazioni → Generali → Fuso orario e scegli «(GMT+02:00) Ora dell'Europa centrale - Roma».`;
        } catch (e) { return ''; }
    }

    function warnTzOnce() {
        let msg = tzMismatchText();
        let key = gCalTz + '|' + TZ;
        if (!msg || lsGet('spesaflow_tzwarn') === key) return;
        lsSet('spesaflow_tzwarn', key);
        let o = openModal(`<h3>🕒 Orari spostati su Google Calendar</h3>
            <div class="gcal-note">${esc(msg)}</div>
            <div class="modal-actions"><button class="btn-confirm" type="button">Ho capito</button></div>`);
        o.querySelector('.btn-confirm').onclick = () => o.remove();
    }

    async function gcalReconcile() {
        if (!gLinked() || !gOriginOk() || !gToken()) { renderGcalBtn(); return; }
        if (gBusy) { gAgain = true; return; }
        gBusy = true;
        gError = '';
        renderGcalBtn();
        let changed = false, fromGoogle = 0;
        try {
            // 1. eventi delle attività eliminate nell'app
            for (let id of gDeletes.slice()) {
                try { await gapi(GCAL_API + '/' + encodeURIComponent(id), { method: 'DELETE' }); }
                catch (e) { if (e.status !== 404 && e.status !== 410) throw e; }
                gDeletes = gDeletes.filter(x => x !== id);
                changed = true;
            }

            // 2. com'è la situazione su Google
            let events = await listLinkedEvents();
            let byId = new Map(events.map(ev => [ev.id, ev]));
            let linked = todos.filter(t => t.gEventId);
            let gone = linked.filter(t => { let ev = byId.get(t.gEventId); return !ev || ev.status === 'cancelled'; });
            if (gone.length && !events.length) {
                // nessuno degli eventi collegati esiste: quasi certamente è un altro account Google
                let e = new Error('account'); e.code = 'account'; throw e;
            }
            if (gone.length) {
                let ok = gone.length < 3 || confirm(`📆 Su Google Calendar risultano eliminate ${gone.length} attività. Eliminarle anche dall'app?\n(Annulla = le tengo nell'app, scollegate da Google)`);
                for (let t of gone) {
                    if (ok) todos = todos.filter(x => x !== t);
                    else { t.gEventId = ''; t.gSynced = ''; t.gSkip = true; }
                }
                changed = true;
                fromGoogle += gone.length;
            }

            // 3. allinea attività ed eventi
            for (let t of todos.slice()) {
                if (t.gEventId) {
                    let ev = byId.get(t.gEventId);
                    if (!ev || ev.status === 'cancelled') continue;
                    if (!t.date) {   // data tolta nell'app: l'evento non serve più
                        try { await gapi(GCAL_API + '/' + encodeURIComponent(t.gEventId), { method: 'DELETE' }); }
                        catch (e) { if (e.status !== 404 && e.status !== 410) throw e; }
                        t.gEventId = ''; t.gSynced = '';
                        changed = true;
                        continue;
                    }
                    let f = eventFields(ev);
                    let googleChanged = ev.updated !== t.gSynced;
                    let localChanged = f ? differs(t, f) : true;
                    if (!localChanged) {
                        if (googleChanged) { t.gSynced = ev.updated; changed = true; }
                        continue;
                    }
                    if (googleChanged && f && Date.parse(ev.updated) > (t.mod || 0)) {
                        Object.assign(t, f);   // vince la modifica fatta su Google
                        t.gSynced = ev.updated;
                        changed = true;
                        fromGoogle++;
                    } else {
                        let up = await gapi(GCAL_API + '/' + encodeURIComponent(t.gEventId), { method: 'PATCH', body: eventBody(t) });
                        t.gSynced = up.updated;
                        changed = true;
                    }
                } else if (t.date && !t.gcal && !t.gSkip) {
                    let ev = await gapi(GCAL_API, { method: 'POST', body: eventBody(t) });
                    t.gEventId = ev.id;
                    t.gSynced = ev.updated;
                    changed = true;
                }
            }
            lsSet('spesaflow_glast', String(Date.now()));
            setTimeout(warnTzOnce, 300);
        } catch (e) {
            if (e.code === 'account') gError = 'Non trovo le attività su questo account Google: collega lo stesso account usato la prima volta';
            else if (e.status === 401) gError = '';   // permesso scaduto: basta toccare "Aggiorna"
            else if (e.status === 403) gError = 'Google ha negato l\'accesso al calendario: scollega e ricollega dando il permesso';
            else gError = 'Nessuna connessione con Google: riprovo più tardi';
        }
        if (changed) { save(); renderTodos(); }
        if (fromGoogle) showToast('📆 Aggiornate le modifiche fatte su Google Calendar');
        gBusy = false;
        renderGcalBtn();
        if (gAgain) { gAgain = false; gcalSoon(); }
    }

    function onGoogleToken(resp) {
        if (!resp || resp.error) {
            gError = 'Accesso a Google non completato';
            renderGcalBtn();
            return;
        }
        if (!google.accounts.oauth2.hasGrantedAllScopes(resp, GCAL_SCOPE)) {
            showToast('⚠️ Serve il permesso di gestire gli eventi del calendario: riprova e spunta la casella', 'error');
            return;
        }
        lsSet('spesaflow_gtoken', JSON.stringify({ token: resp.access_token, exp: Date.now() + (Number(resp.expires_in) || 3600) * 1000 - 60000 }));
        gError = '';
        let first = !gLinked();
        lsSet('spesaflow_glinked', '1');
        if (first) {
            let existing = todos.filter(t => t.date && !t.gEventId && !t.gcal && !t.gSkip);
            let manual = todos.filter(t => t.date && !t.gEventId && t.gcal).length;
            let what = existing.length === 1 ? 'l\'attività con data già presente' : `le ${existing.length} attività con data già presenti`;
            let excl = manual === 1 ? 'Quella già inviata con il vecchio pulsante resta esclusa' : `Le ${manual} già inviate con il vecchio pulsante restano escluse`;
            if (existing.length && !confirm(`📆 Google Calendar collegato! Vuoi aggiungere anche ${what} nell'app?` +
                (manual ? `\n(${excl}, per non creare doppioni.)` : ''))) {
                existing.forEach(t => { t.gSkip = true; });
                save();
            }
            showToast('✅ Google Calendar collegato', 'success');
        }
        renderTodos();
        gcalReconcile();
    }

    // Chiede a Google il permesso (va chiamata dal tocco di un pulsante, altrimenti il browser blocca la finestra)
    function gcalAuth() {
        if (!gOriginOk()) {
            showToast('Il collegamento funziona solo aprendo l\'app da lucioros.github.io/Note', 'error');
            return;
        }
        if (!gTokenClient) {
            if (!(window.google && google.accounts && google.accounts.oauth2)) {
                showToast('❌ Servizio Google non raggiungibile: controlla la connessione e riprova', 'error');
                return;
            }
            gTokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: GCAL_SCOPE,
                callback: onGoogleToken,
                error_callback: () => { gError = ''; renderGcalBtn(); showToast('Accesso a Google annullato'); }
            });
        }
        gTokenClient.requestAccessToken({ prompt: '' });
    }

    function gcalDisconnect() {
        let tok = gToken();
        try { if (tok && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(tok, () => {}); } catch (e) { /* non importante */ }
        gClearToken();
        lsSet('spesaflow_glinked', '');
        gError = '';
        renderTodos();
    }

    function renderGcalBtn() {
        let b = document.getElementById('gcalBtn');
        if (!b) return;
        if (!gLinked()) b.textContent = '🔗 Collega Google Calendar';
        else if (gBusy) b.textContent = '⏳ Google Calendar…';
        else if (gError) b.textContent = '⚠️ Google Calendar';
        else if (!gToken()) b.textContent = '🔄 Aggiorna Google Calendar';
        else b.textContent = '✅ Google Calendar';
    }

    function gcalModalHtml(t, googleDay) {
        if (gLinked()) {
            if (t.gEventId) return `<div class="gcal-linked">🔗 Collegata a Google Calendar: modifiche ed eliminazione si aggiornano anche lì.</div>`;

                return `<div class="gcal-note">${t.gcal ? 'Inviata a Google Calendar con il vecchio pulsante: è una copia non collegata.' : 'Non collegata a Google Calendar.'} <a href="#" class="m-link">Collegala</a>${t.gcal ? ' (poi elimina a mano su Google la copia vecchia).' : ''}</div>`;
            }

        let html = '';

    }

    function showGcalModal() {
        if (!gOriginOk()) {
            let o = openModal(`<h3>📆 Google Calendar</h3>

            ${tzMismatchText() ? `<div class="gcal-note">🕒 ${esc(tzMismatchText())}</div>` : ''}
            <div class="sync-text">Le modifiche passano da sole nei due sensi mentre l'app è aperta. Il permesso di Google dura circa un'ora: quando scade, il pulsante diventa "🔄 Aggiorna" e basta toccarlo.</div>
            <div class="modal-actions">

        o.querySelector('.g-now').onclick = () => { o.remove(); gcalReconcile(); };

    // ---------- CARICAMENTO DATI ----------
    (function init() {

        try {
            let raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                let p = JSON.parse(raw);
                categories = p.categories;
                notes = p.notes;
                cart = p.cart;
                todos = p.todos;
                gDeletes = p.gDeletes;
                dataUpdatedAt = Number(p.updatedAt) || 0;
                normalizeData();
                loadUiState();
                loaded = true;
            }
        } catch (e) {
            loaded = false;
        }
        if (!loaded) loadDefaults();
        // primo disegno: non conta come modifica, altrimenti aprire l'app sovrascriverebbe i dati online
        ensureContainers();
        pruneCart();
        writeLocal();
        render();
        renderTodos();
        loadSync();
        setSyncState(syncOn() ? 'ok' : 'off');
        syncNow();
        setInterval(() => { if (!document.hidden) syncNow(); }, 60000);
        window.addEventListener('online', syncNow);
        setTab(lsGet('spesaflow_tab'));
        renderBackupBanner();
        renderNotifyBtn();
        renderGcalBtn();
        gcalReconcile();
        setInterval(() => { if (!document.hidden) gcalReconcile(); }, 120000);
        checkDue();
        setInterval(checkDue, 30000);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) { checkDue(); renderBackupBanner(); syncNow(); gcalReconcile(); }
        });
    })();
</script>
</body>
</html>
